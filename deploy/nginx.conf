# Configuration nginx de l'image de production (copiée par le Dockerfile).
# Remplace public/.htaccess, que nginx ignore.
#
# HTTPS, certificats et redirection www sont gérés par Traefik dans Coolify
# (onglet Domains), pas ici : ce conteneur ne reçoit que du HTTP.

# Cache et CORS calculés par map pour déclarer chaque add_header une seule fois
# au niveau server : nginx abandonne les add_header hérités dès qu'un bloc
# location en déclare un, ce qui ferait disparaître les en-têtes de sécurité.
map $uri $as_cache_control {
	# Assets Next.js fingerprintés (le nom change à chaque build)
	~^/_next/static/                        "public, max-age=31536000, immutable";
	# Images et polices à nom fixe (icon.png, og.png...) : 30 jours pour qu'une
	# mise à jour finisse par apparaître chez les visiteurs
	~*\.(?:png|webp|svg|jpe?g|ico|woff2)$   "public, max-age=2592000";
	# Pages HTML et fichiers RSC : revalidés pour qu'un déploiement soit immédiat
	default                                 "no-cache";
}

# CORS sur les ressources statiques : requis par les outils qui chargent
# l'image Open Graph via fetch() côté navigateur (valeur vide = pas d'en-tête)
map $uri $as_cors {
	~*\.(?:png|webp|svg|jpe?g|ico|woff2|js|css)$  "*";
	default                                       "";
}

server {
	listen 80;
	listen [::]:80;
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;
	charset_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

	# Derrière Traefik, nginx ne voit que du HTTP : une redirection absolue
	# renverrait vers http:// et ajouterait un aller-retour
	absolute_redirect off;

	# "always" : envoyés aussi sur les erreurs (404...)
	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	# 'unsafe-inline' est requis par les scripts d'hydratation de Next.js en export statique
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io" always;
	add_header Cache-Control $as_cache_control always;
	add_header Access-Control-Allow-Origin $as_cors always;

	error_page 404 /404.html;

	# trailingSlash: true dans next.config.js : /about redirige vers /about/
	# pour éviter deux URL indexées pour la même page (les fichiers, qui ont
	# un point dans leur nom, ne sont pas concernés)
	rewrite ^([^.]*[^/])$ $1/ permanent;

	location / {
		try_files $uri $uri/ =404;
	}
}
